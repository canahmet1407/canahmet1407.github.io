<!doctype html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kılavuz Hürtürk İHA Takımı</title>
<meta name="description" content="Kılavuz Hürtürk İHA Takımı — başvuru formu, Instagram, LinkedIn, YouTube, filomuz ve sponsorluk.">
<meta name="theme-color" content="#080c16">

<!-- Link önizlemesi (WhatsApp, Instagram, LinkedIn). Site adresi değişirse aşağıdaki 2 satırı güncelle. -->
<meta property="og:type" content="website">
<meta property="og:title" content="Kılavuz Hürtürk İHA Takımı">
<meta property="og:description" content="Tasarla · Üret · Uçur — takımın tüm linkleri tek sayfada.">
<meta property="og:url" content="https://canahmet1407.github.io/">
<meta property="og:image" content="https://canahmet1407.github.io/og.png">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="favicon-48.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

<style>
  /* Renkler takım logosundan: kırmızı #e3141f, siyah, beyaz; zemin postredeki gece laciverti */
  :root {
    --bg: #080c16;
    --bg-rgb: 8, 12, 22;
    --panel: rgba(17, 22, 34, 0.80);
    --panel-solid: #111622;
    --line: rgba(176, 192, 225, 0.12);
    --line-strong: rgba(176, 192, 225, 0.26);
    --ink: #eef1f6;
    --ink-2: #a9b1c2;
    --ink-3: #6c7488;
    --accent: #ff3b47;
    --accent-fill: #e3141f;
    --accent-ink: #ffffff;
    --accent-soft: rgba(255, 59, 71, 0.11);
    --accent-glow: rgba(227, 20, 31, 0.40);
    --ok: #34d399;
    --grid: rgba(176, 192, 225, 0.04);
    --sky: rgba(176, 192, 225, 0.05);
    --ground: rgba(227, 20, 31, 0.17);
    --shadow: 0 10px 30px -18px rgba(0, 0, 0, 0.9);
    --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --display: "Chakra Petch", "Inter", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #f2f3f6;
    --bg-rgb: 242, 243, 246;
    --panel: rgba(255, 255, 255, 0.85);
    --panel-solid: #ffffff;
    --line: rgba(15, 20, 40, 0.12);
    --line-strong: rgba(15, 20, 40, 0.26);
    --ink: #0c0f18;
    --ink-2: #434a5c;
    --ink-3: #737b8e;
    --accent: #d0101b;
    --accent-fill: #d0101b;
    --accent-ink: #ffffff;
    --accent-soft: rgba(208, 16, 27, 0.08);
    --accent-glow: rgba(208, 16, 27, 0.28);
    --ok: #0f9f5f;
    --grid: rgba(15, 20, 40, 0.05);
    --sky: rgba(15, 20, 40, 0.03);
    --ground: rgba(208, 16, 27, 0.12);
    --shadow: 0 10px 30px -20px rgba(15, 20, 40, 0.40);
    color-scheme: light;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    background-color: var(--bg);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 32px 32px;
    background-position: center top;
    color: var(--ink);
    font: 400 15px/1.55 var(--sans);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  body::before {
    content: "";
    position: fixed; inset: 0;
    pointer-events: none;
    background:
      radial-gradient(60% 40% at 50% 0%, var(--accent-soft), transparent 70%),
      radial-gradient(120% 80% at 50% 120%, var(--bg), transparent 60%);
    z-index: 0;
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; }
  .mono { font-family: var(--mono); letter-spacing: 0.04em; }

  .wrap {
    position: relative; z-index: 1;
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
    padding: 0 16px calc(40px + env(safe-area-inset-bottom));
  }

  /* ---------- Üst HUD şeridi ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin: 0 -16px;
    padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
    font: 600 11px/1 var(--mono);
    letter-spacing: 0.12em;
    color: var(--ink-3);
    background: linear-gradient(var(--bg) 55%, transparent);
  }
  .sig { display: inline-flex; align-items: center; gap: 8px; }
  .sig i {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--ok);
    box-shadow: 0 0 0 0 rgba(52, 211, 153, .35);
    animation: ping 2.4s ease-out infinite;
  }
  @keyframes ping {
    0% { box-shadow: 0 0 0 0 rgba(52, 211, 153, .35); }
    70%, 100% { box-shadow: 0 0 0 8px transparent; }
  }
  .topbar-r { display: inline-flex; align-items: center; gap: 12px; }
  .brand { display: inline-flex; align-items: center; gap: 10px; }
  .badge { display: block; background: #fff; object-fit: contain; }
  .brand .badge { width: 30px; height: 30px; padding: 2px; border-radius: 8px; box-shadow: 0 0 0 1px var(--line-strong); }
  .icon-btn {
    width: 32px; height: 32px;
    display: inline-grid; place-items: center;
    border: 1px solid var(--line); border-radius: 9px;
    background: var(--panel);
    cursor: pointer;
    color: var(--ink-2);
    transition: border-color .2s, color .2s;
  }
  .icon-btn:hover { border-color: var(--line-strong); color: var(--ink); }
  .icon-btn svg { width: 16px; height: 16px; }
  .icon-btn .sun { display: none; }
  :root[data-theme="light"] .icon-btn .sun { display: block; }
  :root[data-theme="light"] .icon-btn .moon { display: none; }

  /* ---------- Hero ---------- */
  .hero { position: relative; text-align: center; padding: 8px 0 30px; }
  .hero > *:not(.hero-video) { position: relative; z-index: 1; }

  /* Arka planda sessiz uçuş videosu */
  .hero-video {
    position: absolute; z-index: 0;
    top: -90px; bottom: -24px;
    left: 50%; width: 100vw;
    transform: translateX(-50%);
    overflow: hidden;
    pointer-events: none;
    container-type: size;
    opacity: 0;
    transition: opacity 1.8s ease;
  }
  .hero-video.on { opacity: 1; }
  /* Kapak karesi: video oynayamazsa (ör. telefonda) yavaşça yakınlaşan görüntü */
  .hv-poster {
    position: absolute; inset: -4%;
    background: center 42% / cover no-repeat;
    animation: kenburns 28s ease-in-out infinite alternate;
  }
  @keyframes kenburns {
    from { transform: scale(1.04) translate(0, 0); }
    to   { transform: scale(1.2) translate(-3%, 2%); }
  }
  .hero-video iframe {
    position: absolute; top: 50%; left: 50%;
    width: max(100cqw, 177.78cqh);
    height: max(100cqh, 56.25cqw);
    transform: translate(-50%, -50%) scale(1.32);
    border: 0;
    pointer-events: none;
  }
  .hero-video video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  .hero-video iframe, .hero-video video { opacity: 0; transition: opacity 1.4s ease; }
  .hero-video.playing iframe, .hero-video.playing video { opacity: 1; }
  .hero-video::after {
    content: "";
    position: absolute; inset: 0;
    background:
      repeating-linear-gradient(0deg, rgba(0, 0, 0, .16) 0 1px, transparent 1px 3px),
      radial-gradient(110% 80% at 50% 42%, rgba(var(--bg-rgb), .42), rgba(var(--bg-rgb), .86) 72%),
      linear-gradient(180deg, rgba(var(--bg-rgb), .55), rgba(var(--bg-rgb), .15) 30%, rgba(var(--bg-rgb), .35) 70%, rgba(var(--bg-rgb), 1));
  }
  .vid-tag {
    position: absolute !important; right: 0; bottom: 4px;
    display: inline-flex; align-items: center; gap: 7px;
    font: 600 9.5px/1 var(--mono);
    letter-spacing: .14em;
    color: var(--ink-3);
    opacity: 0; visibility: hidden;
    transition: opacity 1s ease 1s, color .2s;
  }
  .vid-tag.on { opacity: 1; visibility: visible; }
  .vid-tag:hover { color: var(--ink); }
  .vid-tag i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: blink 1.2s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .2; } }

  /* Başvuru geri sayımı */
  .countdown {
    margin: 0 0 12px;
    padding: 12px 14px 14px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--panel);
    -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
  }
  .countdown[hidden] { display: none; }
  .cd-top {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    font: 600 10px/1.3 var(--mono);
    letter-spacing: .14em;
    color: var(--ink-3);
  }
  .cd-top b { display: inline-flex; align-items: center; gap: 7px; color: var(--accent); font-weight: 600; }
  .cd-top b::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: blink 1s steps(2) infinite; }
  .cd-digits {
    display: grid;
    grid-template-columns: 1fr auto 1fr auto 1fr auto 1fr;
    align-items: start;
    margin-top: 10px;
    text-align: center;
  }
  .cd-digits b { display: block; font: 600 30px/1 var(--mono); color: var(--ink); font-variant-numeric: tabular-nums; }
  .cd-digits span { display: block; margin-top: 6px; font: 600 9px/1 var(--mono); letter-spacing: .18em; color: var(--ink-3); }
  .cd-digits i { font: 600 22px/1.2 var(--mono); font-style: normal; color: var(--line-strong); }
  .countdown.urgent .cd-digits b { color: var(--accent); }
  .countdown.closed { text-align: center; }
  .countdown.closed .cd-top { justify-content: center; }
  .countdown.closed .cd-top b::before { animation: none; background: var(--ink-3); }
  .countdown.closed .cd-top b { color: var(--ink-2); }

  .tape {
    position: relative;
    height: 34px;
    margin: 4px 0 22px;
    overflow: hidden;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 22%, #000 78%, transparent);
            mask-image: linear-gradient(90deg, transparent, #000 22%, #000 78%, transparent);
  }
  .tape-track { position: absolute; left: 50%; top: 0; height: 100%; will-change: transform; }
  .tape-track svg { display: block; height: 100%; }
  .tape-track line { stroke: var(--ink-3); stroke-width: 1; }
  .tape-track line.maj { stroke: var(--ink-2); }
  .tape-track text { fill: var(--ink-2); font: 600 9px var(--mono); letter-spacing: .06em; }
  .tape-track text.card { fill: var(--accent); }
  .tape-read {
    position: absolute; left: 50%; top: 0;
    transform: translateX(-50%);
    padding: 3px 7px;
    font: 600 10px/1 var(--mono);
    letter-spacing: .1em;
    color: var(--accent);
    background: var(--bg);
    border: 1px solid var(--line-strong);
    border-radius: 4px;
  }
  .tape-caret {
    position: absolute; left: 50%; bottom: 0;
    width: 0; height: 0;
    transform: translateX(-50%);
    border: 5px solid transparent; border-bottom-color: var(--accent);
  }

  .adi {
    position: relative;
    width: 168px; height: 168px;
    margin: 0 auto 18px;
    filter: drop-shadow(0 0 22px var(--accent-soft));
  }
  .adi svg { width: 100%; height: 100%; overflow: visible; }
  .adi.tappable { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .sensor {
    display: inline-flex; align-items: center; gap: 8px;
    margin: -4px auto 16px;
    padding: 7px 12px;
    border-radius: 999px;
    border: 1px solid var(--line-strong);
    background: var(--panel);
    font: 600 10px/1 var(--mono);
    letter-spacing: .14em;
    color: var(--ink-2);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: border-color .2s, color .2s;
  }
  .sensor[hidden] { display: none; }
  .sensor svg { width: 14px; height: 14px; color: var(--accent); }
  .sensor i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); }
  .sensor.live { color: var(--ink); border-color: rgba(52, 211, 153, .45); }
  .sensor.live i { background: var(--ok); animation: ping 2.4s ease-out infinite; }
  .sensor.live svg { display: none; }
  .sensor.err { color: var(--ink-3); border-style: dashed; }
  .adi .ring { fill: none; stroke: var(--line-strong); stroke-width: 1; }
  .adi .ring-in { fill: none; stroke: var(--accent); stroke-width: 1.6; }
  .adi .tick { stroke: var(--ink-2); stroke-width: 1.4; }
  .adi .tick.big { stroke: var(--accent); stroke-width: 2; }
  .adi .sky { fill: var(--sky); }
  .adi .ground { fill: var(--ground); }
  .adi .hz { stroke: var(--accent); stroke-width: 1.6; }
  .adi .pl { stroke: var(--ink-2); stroke-width: 1.2; }
  .adi .pl-t { fill: var(--ink-3); font: 600 7px var(--mono); }
  .adi .plane { fill: none; stroke: var(--ink); stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
  .adi .ptr { fill: var(--accent); }
  .adi .dot { fill: var(--accent); }

  .stars { display: flex; justify-content: center; align-items: flex-end; gap: 7px; margin: 0 0 10px; color: var(--accent); }
  .stars svg { width: 13px; height: 13px; filter: drop-shadow(0 0 6px var(--accent-glow)); }
  .stars svg:nth-child(2) { width: 16px; height: 16px; transform: translateY(-4px); }
  h1 {
    margin: 0;
    font: 700 clamp(50px, 16vw, 70px)/0.92 var(--display);
    letter-spacing: 0.04em;
    text-shadow: 0 6px 30px rgba(var(--bg-rgb), .6);
  }
  .subname {
    margin: 10px 0 0;
    font: 700 14px/1.2 var(--display);
    letter-spacing: .3em;
    color: var(--accent);
  }
  h1 span { color: var(--accent); }
  .tagline {
    margin: 14px 0 0;
    font: 500 14px/1.4 var(--display);
    letter-spacing: .32em;
    text-transform: uppercase;
    color: var(--ink-2);
  }
  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 16px; }
  .chip {
    padding: 5px 9px;
    font: 600 10px/1 var(--mono);
    letter-spacing: .12em;
    color: var(--ink-2);
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--panel);
  }

  /* ---------- HUD köşe braketleri ---------- */
  .brk { position: relative; }
  .brk::before {
    content: "";
    position: absolute; inset: -5px;
    pointer-events: none;
    --c: var(--line-strong); --l: 10px; --w: 1.5px;
    background:
      linear-gradient(var(--c), var(--c)) top left / var(--l) var(--w) no-repeat,
      linear-gradient(var(--c), var(--c)) top left / var(--w) var(--l) no-repeat,
      linear-gradient(var(--c), var(--c)) top right / var(--l) var(--w) no-repeat,
      linear-gradient(var(--c), var(--c)) top right / var(--w) var(--l) no-repeat,
      linear-gradient(var(--c), var(--c)) bottom left / var(--l) var(--w) no-repeat,
      linear-gradient(var(--c), var(--c)) bottom left / var(--w) var(--l) no-repeat,
      linear-gradient(var(--c), var(--c)) bottom right / var(--l) var(--w) no-repeat,
      linear-gradient(var(--c), var(--c)) bottom right / var(--w) var(--l) no-repeat;
    opacity: 0;
    transition: inset .22s ease, opacity .22s ease;
  }
  .brk:hover::before, .brk:focus-visible::before { opacity: 1; inset: -7px; --c: var(--accent); }

  /* ---------- Linkler ---------- */
  .links { display: grid; gap: 12px; }
  .link {
    display: grid;
    grid-template-columns: 44px 1fr auto;
    align-items: center;
    gap: 14px;
    padding: 13px 14px 13px 13px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--panel);
    -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
    box-shadow: var(--shadow);
    transition: transform .18s ease, border-color .18s ease, background-color .18s ease;
    outline: none;
  }
  .link:hover, .link:focus-visible { transform: translateY(-1px); border-color: var(--line-strong); }
  .link:active { transform: translateY(0) scale(.99); }
  .link .ico {
    width: 44px; height: 44px;
    display: grid; place-items: center;
    border-radius: 11px;
    border: 1px solid var(--line);
    background: var(--accent-soft);
    color: var(--accent);
    transition: background-color .18s, color .18s;
  }
  .link:hover .ico { background: var(--accent-fill); color: var(--accent-ink); }
  .link .ico svg { width: 21px; height: 21px; }
  .link .txt { min-width: 0; display: grid; gap: 1px; }
  .link .t { font: 600 16px/1.25 var(--sans); }
  .link .s {
    font: 500 11.5px/1.3 var(--mono);
    letter-spacing: .03em;
    color: var(--ink-3);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .link .go { width: 18px; height: 18px; color: var(--ink-3); transition: transform .18s, color .18s; }
  .link:hover .go { color: var(--accent); transform: translate(2px, -2px); }

  .link.primary {
    position: relative;
    overflow: hidden;
    padding: 17px 16px 17px 15px;
    background: linear-gradient(135deg, var(--accent-fill), #b80d17);
    border-color: transparent;
    color: var(--accent-ink);
    box-shadow: 0 16px 36px -16px var(--accent-glow), 0 0 0 1px rgba(255,255,255,.08) inset;
  }
  .link.primary .ico { background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.24); color: var(--accent-ink); }
  .link.primary .t { font: 700 18px/1.2 var(--display); letter-spacing: .08em; text-transform: uppercase; }
  .link.primary .s { color: currentColor; opacity: .72; white-space: normal; }
  .link.primary .go { color: currentColor; }
  .link.primary::after {
    content: "";
    position: absolute; top: 0; bottom: 0; left: -40%;
    width: 30%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.28), transparent);
    transform: skewX(-18deg);
    animation: sweep 4.5s ease-in-out infinite 1.2s;
    pointer-events: none;
  }
  @keyframes sweep { 0% { left: -40%; } 35%, 100% { left: 130%; } }

  .link.off { opacity: .55; cursor: not-allowed; }
  .link.off:hover { transform: none; border-color: var(--line); }
  .link.off .ico { background: transparent; color: var(--ink-3); }
  .link.primary.off { background: var(--panel); color: var(--ink); box-shadow: none; border-color: var(--line-strong); border-style: dashed; }
  .link.primary.off::after { display: none; }
  .soon {
    font: 600 9.5px/1 var(--mono);
    letter-spacing: .12em;
    padding: 4px 6px;
    border-radius: 4px;
    border: 1px dashed var(--line-strong);
    color: var(--ink-3);
  }

  /* ---------- Bölümler ---------- */
  section { margin-top: 42px; }
  .sec-h {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 16px;
    font: 600 11px/1 var(--mono);
    letter-spacing: .16em;
    color: var(--ink-3);
    text-transform: uppercase;
  }
  .sec-h .idx { color: var(--accent); }
  .sec-h h2 {
    margin: 0;
    font: 700 13px/1 var(--display);
    letter-spacing: .22em;
    color: var(--ink);
    text-transform: uppercase;
  }
  .sec-h .rule { flex: 1; height: 1px; background: linear-gradient(90deg, var(--line-strong), transparent); }

  .panel {
    padding: 18px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--panel);
    -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
    box-shadow: var(--shadow);
  }
  .about { position: relative; overflow: hidden; padding: 22px 20px 20px; }
  .about::after {
    content: "";
    position: absolute; right: -130px; top: -130px;
    width: 280px; height: 280px;
    border-radius: 50%;
    background:
      linear-gradient(var(--line), var(--line)) center / 100% 1px no-repeat,
      linear-gradient(var(--line), var(--line)) center / 1px 100% no-repeat,
      repeating-radial-gradient(circle at center, transparent 0 27px, var(--line-strong) 27px 28px);
    -webkit-mask-image: radial-gradient(circle, #000 30%, transparent 70%);
            mask-image: radial-gradient(circle, #000 30%, transparent 70%);
    opacity: .7;
    pointer-events: none;
  }
  .kicker {
    display: flex; align-items: center; gap: 8px;
    margin: 0 0 12px;
    font: 600 10.5px/1 var(--mono);
    letter-spacing: .2em;
    color: var(--accent);
  }
  .kicker::after { content: ""; width: 28px; height: 1px; background: var(--accent); opacity: .6; }
  .lead {
    position: relative; z-index: 1;
    margin: 0;
    padding-left: 14px;
    border-left: 2px solid var(--accent);
    font: 600 20px/1.42 var(--display);
    letter-spacing: .005em;
    color: var(--ink);
    text-wrap: pretty;
  }
  .lead em { font-style: normal; color: var(--accent); }
  .about .body {
    position: relative; z-index: 1;
    margin: 14px 0 0;
    color: var(--ink-2);
    font-size: 15px; line-height: 1.65;
    text-wrap: pretty;
  }

(function adi() {

    const big = a === 0 || Math.abs(a) === 30 || Math.abs(a) === 60;
    const r1 = big ? 83 : 86, r2 = 93;
    const rad = (a - 90) * Math.PI / 180;
    ticks += `<line class="tick${big ? " big" : ""}" x1="${(r1 * Math.cos(rad)).toFixed(2)}" y1="${(r1 * Math.sin(rad)).toFixed(2)}" x2="${(r2 * Math.cos(rad)).toFixed(2)}" y2="${(r2 * Math.sin(rad)).toFixed(2)}"/>`;
  });
  let ladder = "";
  [-30, -20, -10, 10, 20, 30].forEach((p) => {
    const y = -p * 2.2, w = Math.abs(p) === 10 ? 18 : Math.abs(p) === 20 ? 28 : 34;
    ladder += `<line class="pl" x1="${-w}" x2="${w}" y1="${y}" y2="${y}"/>`;
    ladder += `<text class="pl-t" x="${w + 4}" y="${y + 2.5}">${Math.abs(p)}</text><text class="pl-t" x="${-w - 14}" y="${y + 2.5}">${Math.abs(p)}</text>`;
  });
  [-5, 5, -15, 15, -25, 25].forEach((p) => { const y = -p * 2.2; ladder += `<line class="pl" x1="-8" x2="8" y1="${y}" y2="${y}"/>`; });

  const inner = `
      <g clip-path="url(#adiClip)">
        <g id="horizon">

          <rect class="ground" x="-200" y="0" width="400" height="200"/>

  host.innerHTML = `

      <defs><clipPath id="adiClip"><circle r="76"/></clipPath></defs>

})();

/* Pusula bandı + yapay ufuk
   Masaüstünde demo animasyonu oynar; telefonda jiroskop/pusula sensörleriyle gerçek zamanlı çalışır. */
(function instruments() {
  const PX = 1.6; // derece başına piksel
  const W = 360 * PX;
  const names = { 0: "K", 90: "D", 180: "G", 270: "B" }; // Kuzey, Doğu, Güney, Batı
  let s = "";
  for (let d = 0; d < 720; d += 5) {
    const x = d * PX, deg = d % 360;
    if (deg % 30 === 0) {
      s += `<line class="maj" x1="${x}" x2="${x}" y1="20" y2="34"/>`;
      const lab = names[deg] ?? String(deg).padStart(3, "0");
      s += `<text class="${names[deg] ? "card" : ""}" x="${x}" y="15" text-anchor="middle">${lab}</text>`;
    } else {
      s += `<line x1="${x}" x2="${x}" y1="${deg % 10 === 0 ? 26 : 29}" y2="34"/>`;
    }
  }
  const track = $("tapeTrack");
  track.innerHTML = `<svg width="${W * 2}" viewBox="0 0 ${W * 2} 34">${s}</svg>`;

  const horizon = document.getElementById("horizon");
  const rollPtr = document.getElementById("rollPtr");
  const hdgEl = $("hdg"), altEl = $("teleAlt"), spdEl = $("teleSpd");
  const adiEl = $("adi"), btn = $("sensorBtn"), btnTxt = $("sensorTxt");

  const D2R = Math.PI / 180, R2D = 180 / Math.PI;
  const wrap360 = (x) => ((x % 360) + 360) % 360;
  const angDiff = (from, to) => ((to - from + 540) % 360) - 180; // en kısa yoldan fark
  const clamp = (x, lo, hi) => Math.max(lo, Math.min(hi, x));

  // hdg/roll/pitch: ekranda gösterilen; tH/tR/tP: sensörden gelen hedef
  const st = { mode: "demo", hdg: 274, roll: 0, pitch: 0, tH: 274, tR: 0, tP: 0,
               rawPitch: 0, pitch0: null, compass: false, startAt: 0 };
  window.__htInstruments = st;

  const screenAngle = () =>
    (screen.orientation && typeof screen.orientation.angle === "number") ? screen.orientation.angle : (window.orientation || 0);

  function onOrient(e, isAbsEvent) {
    if (e.beta == null || e.gamma == null) return;
    const iosHeading = typeof e.webkitCompassHeading === "number" && !isNaN(e.webkitCompassHeading);
    if (!isAbsEvent && st.absEvents && !iosHeading) return; // mutlak akış varken göreli olayı atla

    const a = (e.alpha || 0) * D2R, b = e.beta * D2R, g = e.gamma * D2R;
    const ca = Math.cos(a), sa = Math.sin(a), cb = Math.cos(b), sb = Math.sin(b), cg = Math.cos(g), sg = Math.sin(g);
    const scr = screenAngle() * D2R, ss = Math.sin(scr), cs = Math.cos(scr);

    // Dünyanın "yukarı" yönü, cihaz ekseninde (yerçekiminin tersi)
    const ux = -cb * sg, uy = sb, uz = cb * cg;
    // Ekran eksenine çevir (yatay tutuşu da destekler)
    const ex = ux * cs - uy * ss;   // ekranın sağı
    const ey = ux * ss + uy * cs;   // ekranın üstü

    // Yatış: telefon direksiyon gibi döndükçe gerçek ufukla hizalı kalır
    st.tR = Math.asin(clamp(-ex, -1, 1)) * R2D;
    // Yunuslama: tutuş açısına göre (ilk okumada sıfırlanır)
    st.rawPitch = Math.atan2(uz, ey) * R2D;
    if (st.pitch0 === null && performance.now() - st.startAt > 350) st.pitch0 = st.rawPitch;
    st.tP = st.pitch0 === null ? 0 : clamp(angDiff(st.rawPitch, st.pitch0), -90, 90);

    // Pusula: telefonun "burnu" = gövde düzleminde (üst kenar–arka kamera) yere paralel olan yön.
    // Dik tutuşta arka kamera, düz tutuşta üst kenar; yana yatırmak (roll) yönü kaydırmaz.
    if (iosHeading) {
      st.tH = wrap360(e.webkitCompassHeading + screenAngle());
      st.compass = true;
    } else {
      const R00 = ca * cg - sa * sb * sg, R01 = -sa * cb, R02 = ca * sg + sa * sb * cg;
      const R10 = sa * cg + ca * sb * sg, R11 = ca * cb, R12 = sa * sg - ca * sb * cg;
      const Tx = R00 * ss + R01 * cs, Ty = R10 * ss + R11 * cs;   // ekranın üstü
      const Vx = -R02, Vy = -R12;                                 // arka kamera
      const wT = uz, wV = ey;
      const Fx = wT * Tx + wV * Vx, Fy = wT * Ty + wV * Vy;
      if (Math.hypot(Fx, Fy) > 0.15) st.tH = wrap360(Math.atan2(Fx, Fy) * R2D);
      st.compass = isAbsEvent;
    }
    if (st.mode !== "live") goLive();
  }

  function setBtn(text, cls) {
    btn.hidden = false;
    btn.className = "sensor" + (cls ? " " + cls : "");
    btnTxt.textContent = text;
  }

  function goLive() {
    st.mode = "live";
    st.hdg = st.tH; st.roll = st.tR; st.pitch = st.tP;
    setBtn(st.compass ? "CANLI · SIFIRLAMAK İÇİN DOKUN" : "CANLI GYRO · SIFIRLAMAK İÇİN DOKUN", "live");
    altEl.parentElement.classList.add("live");
    if (!running) { running = true; requestAnimationFrame(frame); }
  }

  let attached = false;
  function attach() {
    if (attached) return;
    attached = true;
    st.startAt = performance.now();
    if ("ondeviceorientationabsolute" in window) {
      window.addEventListener("deviceorientationabsolute", (e) => { st.absEvents = true; onOrient(e, true); });
    }
    window.addEventListener("deviceorientation", (e) => onOrient(e, e.absolute === true));
    setTimeout(() => { if (st.mode !== "live") setBtn("SENSÖR BULUNAMADI", "err"); }, 2500);
  }

  async function start() {
    if (st.mode === "live") {           // canlıyken dokunmak = ufku sıfırla
      st.pitch0 = st.rawPitch;
      toast("Ufuk sıfırlandı");
      return;
    }
    try {
      const DOE = window.DeviceOrientationEvent;
      if (DOE && typeof DOE.requestPermission === "function") {   // iOS izin ister
        const res = await DOE.requestPermission();
        if (res !== "granted") { setBtn("İZİN VERİLMEDİ", "err"); return; }
      }
      setBtn("BAĞLANIYOR…");
      attach();
    } catch (err) {
      setBtn("SENSÖR AÇILAMADI", "err");
    }
  }

  const touch = ("ontouchstart" in window) || navigator.maxTouchPoints > 0;
  if (touch && "DeviceOrientationEvent" in window) {
    btn.hidden = false;
    adiEl.classList.add("tappable");
    btn.addEventListener("click", start);
    adiEl.addEventListener("click", start);
    // İzin gerektirmeyen tarayıcılarda (Android) kendiliğinden başla
    if (typeof DeviceOrientationEvent.requestPermission !== "function") attach();
  }

  let running = true;
  const t0 = performance.now();
  let lastTele = 0;
  function frame(now) {
    const t = (now - t0) / 1000;
    if (st.mode === "demo") {
      st.hdg = wrap360(274 + t * 4);
      st.roll = 8 * Math.sin(t * 0.45);
      st.pitch = 4 * Math.sin(t * 0.31 + 1);
    } else {
      st.hdg = wrap360(st.hdg + angDiff(st.hdg, st.tH) * 0.15);
      st.roll += (st.tR - st.roll) * 0.25;
      st.pitch += (st.tP - st.pitch) * 0.25;
    }
    const p = clamp(st.pitch, -40, 40) * 2.2;
    track.style.transform = `translateX(${(-st.hdg * PX).toFixed(1)}px)`;
    hdgEl.textContent = "HDG " + String(Math.round(st.hdg) % 360).padStart(3, "0");
    if (horizon) horizon.setAttribute("transform", `rotate(${(-st.roll).toFixed(2)}) translate(0 ${p.toFixed(2)})`);
    if (rollPtr) rollPtr.setAttribute("transform", `rotate(${(-st.roll).toFixed(2)})`);

    if (now - lastTele > 200) {
      lastTele = now;
      if (st.mode === "live") {
        const sgn = (v) => (v >= 0 ? "+" : "−") + String(Math.abs(Math.round(v))).padStart(2, "0");
        altEl.textContent = "ROLL " + sgn(st.roll) + "°";
        spdEl.textContent = "PITCH " + sgn(st.pitch) + "°";
      } else {
        altEl.textContent = "ALT " + Math.round(120 + 6 * Math.sin(t * 0.2)) + "M";
        spdEl.textContent = "GS " + (18 + 1.5 * Math.sin(t * 0.33)).toFixed(1) + "M/S";
      }
    }
    if (!reduceMotion || st.mode === "live") requestAnimationFrame(frame);
    else running = false;
  }
  requestAnimationFrame(frame);
})();

function renderLinks() {
$("links").innerHTML = SITE.links.map((l, i) => {
  if (l.primary && applyClosed()) l = { ...l, url: "", label: "Başvurular Kapandı", sub: "Yeni dönem için Instagram'ı takip et" };
  const has = !!l.url;
  const cls = `link brk rise${l.primary ? " primary" : ""}${has ? "" : " off"}`;
  const delay = `style="animation-delay:${0.28 + i * 0.06}s"`;
  const end = has ? `<span class="go">${ICONS.arrow}</span>` : `<span class="soon">YAKINDA</span>`;
  const body = `<span class="ico">${ICONS[l.icon] || ICONS.arrow}</span>
      <span class="txt"><span class="t">${esc(l.label)}</span><span class="s">${esc(l.sub || "")}</span></span>${end}`;
  return has
    ? `<a class="${cls}" ${delay} href="${esc(l.url)}" target="_blank" rel="noopener">${body}</a>`
    : `<div class="${cls}" ${delay} aria-disabled="true">${body}</div>`;
}).join("");
}
renderLinks();

/* ---------- Geri sayım ---------- */
(function countdown() {
  const box = $("countdown");
  if (isNaN(deadlineMs)) return;
  box.hidden = false;
  const pad = (n) => String(n).padStart(2, "0");
  let wasClosed = applyClosed();
  if (wasClosed) {
    box.className = "countdown closed";
    box.innerHTML = `<div class="cd-top"><b>BAŞVURULAR KAPANDI</b></div>`;
    return;
  }
  box.innerHTML = `
    <div class="cd-top"><b>BAŞVURULAR KAPANIYOR</b><span>${esc(SITE.apply.deadlineLabel || "")}</span></div>
    <div class="cd-digits" role="timer" aria-live="off">
      <div><b id="cdD">00</b><span>GÜN</span></div><i>:</i>
      <div><b id="cdH">00</b><span>SAAT</span></div><i>:</i>
      <div><b id="cdM">00</b><span>DAKİKA</span></div><i>:</i>
      <div><b id="cdS">00</b><span>SANİYE</span></div>
    </div>`;
  const D = $("cdD"), H = $("cdH"), M = $("cdM"), S = $("cdS");
  function tick() {
    const left = deadlineMs - Date.now();
    if (left <= 0) {
      clearInterval(timer);
      box.className = "countdown closed";
      box.innerHTML = `<div class="cd-top"><b>BAŞVURULAR KAPANDI</b></div>`;
      renderLinks();
      return;
    }
    const sec = Math.floor(left / 1000);
    D.textContent = pad(Math.floor(sec / 86400));
    H.textContent = pad(Math.floor(sec / 3600) % 24);
    M.textContent = pad(Math.floor(sec / 60) % 60);
    S.textContent = pad(sec % 60);
    box.classList.toggle("urgent", left < 86400000);
  }
  const timer = setInterval(tick, 1000);
  tick();
})();

/* ---------- Detay paneli (uçak & ekip) ---------- */
const sheet = $("sheet");
function openSheet(html) {
  $("sheetBody").innerHTML = html;
  sheet.querySelector(".sheet-in").scrollTop = 0;
  if (typeof sheet.showModal === "function") sheet.showModal(); else sheet.setAttribute("open", "");
  document.body.classList.add("sheet-open");
}
function closeSheet() { if (sheet.open) { if (typeof sheet.close === "function") sheet.close(); else sheet.removeAttribute("open"); } }
sheet.addEventListener("close", () => document.body.classList.remove("sheet-open"));
sheet.addEventListener("click", (e) => { if (e.target === sheet) closeSheet(); });
$("sheetClose").addEventListener("click", closeSheet);

const splitVal = (v) => { const m = String(v).match(/^(.*\S)\s+(\S+)$/); return m ? `${esc(m[1])}<small>${esc(m[2])}</small>` : esc(v); };
const STAT_KEYS = [["wingspan", "KANAT AÇIKLIĞI"], ["weight", "KALKIŞ AĞIRLIĞI"], ["endurance", "UÇUŞ SÜRESİ"]];
const SPEC_KEYS = [["length", "Gövde uzunluğu"], ["speed", "Hız"], ["motor", "Motor"], ["prop", "Pervane"], ["battery", "Batarya"]];

function fleetSheet(a) {
  const sp = a.specs;
  const tags = [a.role && `<span class="tag red">${esc(a.role.toLocaleUpperCase("tr-TR"))}</span>`, a.year && `<span class="tag">${esc(a.year)}</span>`].filter(Boolean).join("");
  let body = `<p class="sh-kicker">FİLO</p><div class="sh-title"><h3 id="sheetTitle">${esc(a.name)}</h3>${tags}</div>`;
  if (!sp) {
    body += `<div class="soon-box"><b>YAKINDA</b>Teknik bilgiler yakında yüklenecek.</div>`;
  } else {
    const stats = STAT_KEYS.filter(([k]) => sp[k]).map(([k, l]) => `<div class="stat"><b>${splitVal(sp[k])}</b><span>${l}</span></div>`).join("");
    const rows = SPEC_KEYS.filter(([k]) => sp[k]).map(([k, l]) => `<div><dt>${l}</dt><dd>${esc(sp[k])}</dd></div>`).join("");
    body += (stats ? `<div class="stats">${stats}</div>` : "") + (rows ? `<dl class="specs">${rows}</dl>` : "");
  }
  if (a.video) body += `<a class="btn solid sh-cta" href="${esc(a.video)}" target="_blank" rel="noopener">${ICONS.play}Uçuş videosunu izle</a>`;
  const photo = a.photo ? `<div class="sh-photo"><img src="${esc(a.photo)}" alt="${esc(a.name)}"></div>` : "";
  return photo + `<div class="sh-body${photo ? "" : " pad-top"}">${body}</div>`;
}

function teamSheet(t, i) {
  const closed = applyClosed();
  const url = applyUrl(t.unit);
  const cta = closed || !url
    ? `<span class="btn solid off sh-cta">Başvurular kapandı</span>`
    : `<a class="btn solid sh-cta" href="${esc(url)}" target="_blank" rel="noopener">${ICONS.form}Bu ekibe başvur</a>
       <p class="sh-note">Form, "${esc(t.unit)}" birimi seçili açılır.</p>`;
  return `<div class="sh-body pad-top">
    <div class="team-head"><span class="ci">${ICONS[t.icon] || ""}</span>
      <div><p class="sh-kicker">ALT EKİP ${String(i + 1).padStart(2, "0")}</p><h3 id="sheetTitle">${esc(t.label)}</h3></div></div>
    <p class="sh-text">${esc(t.text)}</p>
    ${t.skills && t.skills.length ? `<p class="skills-h">ARANAN</p><div class="skills">${t.skills.map((k) => `<span class="skill">${esc(k)}</span>`).join("")}</div>` : ""}
    ${cta}
  </div>`;
}

$("fleet").addEventListener("click", (e) => { const b = e.target.closest(".ac"); if (b) openSheet(fleetSheet(SITE.fleet[+b.dataset.i])); });
$("caps").addEventListener("click", (e) => { const b = e.target.closest(".cap"); if (b) openSheet(teamSheet(SITE.teams[+b.dataset.i], +b.dataset.i)); });

/* ---------- Arka plan videosu ----------
   1) Kapak karesi her cihazda hemen görünür.
   2) "file" (.mp4) verilmişse her cihazda o oynar (telefonda da kendiliğinden başlar).
   3) Yoksa yalnız bilgisayarda YouTube oynatıcısı açılır; YouTube telefonda kendiliğinden oynatmıyor. */
(function heroVideo() {
  const v = SITE.heroVideo;
  const host = $("heroVideo"), tag = $("vidTag"), poster = $("heroPoster");
  if (!v || (!v.id && !v.file)) { host.remove(); tag.remove(); return; }
  tag.href = v.id ? "https://www.youtube.com/watch?v=" + encodeURIComponent(v.id) : v.file;
  $("vidTagTxt").textContent = v.title || "";

  const posterUrl = v.poster || (v.id ? `https://i.ytimg.com/vi/${encodeURIComponent(v.id)}/maxresdefault.jpg` : "");
  const reveal = () => { host.classList.add("on"); tag.classList.add("on"); };
  const playing = () => { host.classList.add("on", "playing"); tag.classList.add("on"); };
  if (posterUrl) {
    const im = new Image();
    im.onload = () => { poster.style.backgroundImage = `url("${posterUrl}")`; reveal(); };
    im.src = posterUrl;
  }

  const conn = navigator.connection;
  if (reduceMotion || (conn && conn.saveData)) return;     // yalnız kapak karesi

  let ctl = null;                                           // { play, pause }
  if ("IntersectionObserver" in window) {
    new IntersectionObserver((ents) => ents.forEach((en) => {
      if (ctl) en.isIntersecting ? ctl.play() : ctl.pause();
    }), { threshold: 0 }).observe(document.querySelector(".hero"));
  }

  if (v.file) {
    const vid = document.createElement("video");
    vid.muted = true; vid.defaultMuted = true; vid.loop = true; vid.autoplay = true;
    vid.playsInline = true; vid.preload = "auto";
    ["muted", "playsinline", "autoplay", "loop"].forEach((k) => vid.setAttribute(k, ""));
    if (posterUrl) vid.poster = posterUrl;
    vid.src = v.file;
    vid.addEventListener("playing", playing);
    host.appendChild(vid);
    const tryPlay = () => vid.play().catch(() => {});
    tryPlay();
    ctl = { play: tryPlay, pause: () => vid.pause() };
    return;
  }

  if (!v.id || matchMedia("(pointer: coarse)").matches) return;   // telefonda YouTube yükleme

  let t = 0;
  window.onYouTubeIframeAPIReady = () => {
    const player = new YT.Player("heroYT", {
      videoId: v.id,
      host: "https://www.youtube-nocookie.com",
      playerVars: { autoplay: 1, mute: 1, controls: 0, loop: 1, playlist: v.id, playsinline: 1, rel: 0,
                    modestbranding: 1, disablekb: 1, fs: 0, iv_load_policy: 3, start: v.start || 0 },
      events: {
        onReady: (e) => { e.target.mute(); e.target.playVideo(); ctl = { play: () => e.target.playVideo(), pause: () => e.target.pauseVideo() }; },
        onStateChange: (e) => {
          if (e.data === 1) { clearTimeout(t); t = setTimeout(playing, 1600); }
          if (e.data === 0) { e.target.seekTo(v.start || 0); e.target.playVideo(); }
        },
      },
    });
  };
  const load = () => {
    const sc = document.createElement("script");
    sc.src = "https://www.youtube.com/iframe_api";
    sc.async = true;
    document.head.appendChild(sc);
  };
  if (document.readyState === "complete") setTimeout(load, 300);
  else window.addEventListener("load", () => setTimeout(load, 300));
})();

/* ---------- Alt bilgi & paylaş ---------- */
$("copy").textContent = SITE.footer;
const toast = (msg) => { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 1800); };
$("shareBtn").addEventListener("click", async () => {
  const data = { title: document.title, text: "Kılavuz Hürtürk İHA Takımı", url: location.href };
  try {
    if (navigator.share) { await navigator.share(data); return; }
    await navigator.clipboard.writeText(location.href);
    toast("Link kopyalandı");
  } catch (e) {
    if (e && e.name === "AbortError") return;
    toast(location.href);
  }
});

/* Kaydırınca beliren bölümler */
(function reveal() {
  if (reduceMotion || !("IntersectionObserver" in window)) return;
  document.querySelectorAll(".ac.rise").forEach((el) => { el.style.animationPlayState = "paused"; });
  const io = new IntersectionObserver((entries) => {
    entries.forEach((e) => { if (e.isIntersecting) { e.target.style.animationPlayState = "running"; io.unobserve(e.target); } });
  }, { threshold: 0.15 });
  document.querySelectorAll(".ac.rise").forEach((el, i) => { el.style.animationDelay = (i % 2) * 0.08 + "s"; io.observe(el); });
})();
</script>
