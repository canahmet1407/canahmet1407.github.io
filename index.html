<!doctype html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hürtürk İHA Takımı</title>
<meta name="description" content="Hürtürk İHA Takımı — Instagram, LinkedIn, YouTube, başvuru formu, filomuz ve sponsorluk.">
<meta name="theme-color" content="#080c16">

<!-- Link önizlemesi (WhatsApp, Instagram, LinkedIn). Site adresi değişirse aşağıdaki 2 satırı güncelle. -->
<meta property="og:type" content="website">
<meta property="og:title" content="Hürtürk İHA Takımı">
<meta property="og:description" content="Tasarla · Üret · Uçur — takımın tüm linkleri tek sayfada.">
<meta property="og:url" content="https://canahmet1407.github.io/">
<meta property="og:image" content="https://canahmet1407.github.io/og.png">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="favicon-48.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

<style>
  /* Renkler takım logosundan: kırmızı #e3141f, siyah, beyaz; zemin postredeki gece laciverti */
  :root {
    --bg: #080c16;
    --panel: rgba(17, 22, 34, 0.80);
    --panel-solid: #111622;
    --line: rgba(176, 192, 225, 0.12);
    --line-strong: rgba(176, 192, 225, 0.26);
    --ink: #eef1f6;
    --ink-2: #a9b1c2;
    --ink-3: #6c7488;
    --accent: #ff3b47;
    --accent-fill: #e3141f;
    --accent-ink: #ffffff;
    --accent-soft: rgba(255, 59, 71, 0.11);
    --accent-glow: rgba(227, 20, 31, 0.40);
    --ok: #34d399;
    --grid: rgba(176, 192, 225, 0.04);
    --sky: rgba(176, 192, 225, 0.05);
    --ground: rgba(227, 20, 31, 0.17);
    --shadow: 0 10px 30px -18px rgba(0, 0, 0, 0.9);
    --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --display: "Chakra Petch", "Inter", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #f2f3f6;
    --panel: rgba(255, 255, 255, 0.85);
    --panel-solid: #ffffff;
    --line: rgba(15, 20, 40, 0.12);
    --line-strong: rgba(15, 20, 40, 0.26);
    --ink: #0c0f18;
    --ink-2: #434a5c;
    --ink-3: #737b8e;
    --accent: #d0101b;
    --accent-fill: #d0101b;
    --accent-ink: #ffffff;
    --accent-soft: rgba(208, 16, 27, 0.08);
    --accent-glow: rgba(208, 16, 27, 0.28);
    --ok: #0f9f5f;
    --grid: rgba(15, 20, 40, 0.05);
    --sky: rgba(15, 20, 40, 0.03);
    --ground: rgba(208, 16, 27, 0.12);
    --shadow: 0 10px 30px -20px rgba(15, 20, 40, 0.40);
    color-scheme: light;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    background-color: var(--bg);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 32px 32px;
    background-position: center top;
    color: var(--ink);
    font: 400 15px/1.55 var(--sans);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  body::before {
    content: "";
    position: fixed; inset: 0;
    pointer-events: none;
    background:
      radial-gradient(60% 40% at 50% 0%, var(--accent-soft), transparent 70%),
      radial-gradient(120% 80% at 50% 120%, var(--bg), transparent 60%);
    z-index: 0;
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; }
  .mono { font-family: var(--mono); letter-spacing: 0.04em; }

  .wrap {
    position: relative; z-index: 1;
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
    padding: 0 16px calc(40px + env(safe-area-inset-bottom));
  }

  /* ---------- Üst HUD şeridi ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin: 0 -16px;
    padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
    font: 600 11px/1 var(--mono);
    letter-spacing: 0.12em;
    color: var(--ink-3);
    background: linear-gradient(var(--bg) 55%, transparent);
  }
  .sig { display: inline-flex; align-items: center; gap: 8px; }
  .sig i {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--ok);
    box-shadow: 0 0 0 0 rgba(52, 211, 153, .35);
    animation: ping 2.4s ease-out infinite;
  }
  @keyframes ping {
    0% { box-shadow: 0 0 0 0 rgba(52, 211, 153, .35); }
    70%, 100% { box-shadow: 0 0 0 8px transparent; }
  }
  .topbar-r { display: inline-flex; align-items: center; gap: 12px; }
  .brand { display: inline-flex; align-items: center; gap: 10px; }
  .badge { display: block; background: #fff; object-fit: contain; }
  .brand .badge { width: 30px; height: 30px; padding: 2px; border-radius: 8px; box-shadow: 0 0 0 1px var(--line-strong); }
  .icon-btn {
    width: 32px; height: 32px;
    display: inline-grid; place-items: center;
    border: 1px solid var(--line); border-radius: 9px;
    background: var(--panel);
    cursor: pointer;
    color: var(--ink-2);
    transition: border-color .2s, color .2s;
  }
  .icon-btn:hover { border-color: var(--line-strong); color: var(--ink); }
  .icon-btn svg { width: 16px; height: 16px; }
  .icon-btn .sun { display: none; }
  :root[data-theme="light"] .icon-btn .sun { display: block; }
  :root[data-theme="light"] .icon-btn .moon { display: none; }

  /* ---------- Hero ---------- */
  .hero { text-align: center; padding: 8px 0 26px; }

  .tape {
    position: relative;
    height: 34px;
    margin: 4px 0 22px;
    overflow: hidden;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 22%, #000 78%, transparent);
            mask-image: linear-gradient(90deg, transparent, #000 22%, #000 78%, transparent);
  }
  .tape-track { position: absolute; left: 50%; top: 0; height: 100%; will-change: transform; }
  .tape-track svg { display: block; height: 100%; }
  .tape-track line { stroke: var(--ink-3); stroke-width: 1; }
  .tape-track line.maj { stroke: var(--ink-2); }
  .tape-track text { fill: var(--ink-2); font: 600 9px var(--mono); letter-spacing: .06em; }
  .tape-track text.card { fill: var(--accent); }
  .tape-read {
    position: absolute; left: 50%; top: 0;
    transform: translateX(-50%);
    padding: 3px 7px;
    font: 600 10px/1 var(--mono);
    letter-spacing: .1em;
    color: var(--accent);
    background: var(--bg);
    border: 1px solid var(--line-strong);
    border-radius: 4px;
  }
  .tape-caret {
    position: absolute; left: 50%; bottom: 0;
    width: 0; height: 0;
    transform: translateX(-50%);
    border: 5px solid transparent; border-bottom-color: var(--accent);
  }

  .adi {
    position: relative;
    width: 168px; height: 168px;
    margin: 0 auto 18px;
    filter: drop-shadow(0 0 22px var(--accent-soft));
  }
  .adi svg { width: 100%; height: 100%; overflow: visible; }
  .adi .ring { fill: none; stroke: var(--line-strong); stroke-width: 1; }
  .adi .ring-in { fill: none; stroke: var(--accent); stroke-width: 1.6; }
  .adi .tick { stroke: var(--ink-2); stroke-width: 1.4; }
  .adi .tick.big { stroke: var(--accent); stroke-width: 2; }
  .adi .sky { fill: var(--sky); }
  .adi .ground { fill: var(--ground); }
  .adi .hz { stroke: var(--accent); stroke-width: 1.6; }
  .adi .pl { stroke: var(--ink-2); stroke-width: 1.2; }
  .adi .pl-t { fill: var(--ink-3); font: 600 7px var(--mono); }
  .adi .plane { fill: none; stroke: var(--ink); stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
  .adi .ptr { fill: var(--accent); }
  .adi .dot { fill: var(--accent); }

  .stars { display: flex; justify-content: center; align-items: flex-end; gap: 7px; margin: 0 0 10px; color: var(--accent); }
  .stars svg { width: 13px; height: 13px; filter: drop-shadow(0 0 6px var(--accent-glow)); }
  .stars svg:nth-child(2) { width: 16px; height: 16px; transform: translateY(-4px); }
  .callsign {
    margin: 0 0 6px;
    font: 600 11px/1 var(--mono);
    letter-spacing: .28em;
    color: var(--accent);
  }
  h1 {
    margin: 0;
    font: 700 clamp(40px, 12vw, 54px)/0.95 var(--display);
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }
  h1 span { color: var(--accent); }
  .tagline {
    margin: 12px 0 0;
    font: 500 14px/1.4 var(--display);
    letter-spacing: .32em;
    text-transform: uppercase;
    color: var(--ink-2);
  }
  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 16px; }
  .chip {
    padding: 5px 9px;
    font: 600 10px/1 var(--mono);
    letter-spacing: .12em;
    color: var(--ink-2);
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--panel);
  }

  /* ---------- HUD köşe braketleri ---------- */
  .brk { position: relative; }
  .brk::before {
    content: "";
    position: absolute; inset: -5px;
    pointer-events: none;
    --c: var(--line-strong); --l: 10px; --w: 1.5px;
    background:
      linear-gradient(var(--c), var(--c)) top left / var(--l) var(--w) no-repeat,
      linear-gradient(var(--c), var(--c)) top left / var(--w) var(--l) no-repeat,
      linear-gradient(var(--c), var(--c)) top right / var(--l) var(--w) no-repeat,
      linear-gradient(var(--c), var(--c)) top right / var(--w) var(--l) no-repeat,
      linear-gradient(var(--c), var(--c)) bottom left / var(--l) var(--w) no-repeat,
      linear-gradient(var(--c), var(--c)) bottom left / var(--w) var(--l) no-repeat,
      linear-gradient(var(--c), var(--c)) bottom right / var(--l) var(--w) no-repeat,
      linear-gradient(var(--c), var(--c)) bottom right / var(--w) var(--l) no-repeat;
    opacity: 0;
    transition: inset .22s ease, opacity .22s ease;
  }
  .brk:hover::before, .brk:focus-visible::before { opacity: 1; inset: -7px; --c: var(--accent); }

  /* ---------- Linkler ---------- */
  .links { display: grid; gap: 12px; }
  .link {
    display: grid;
    grid-template-columns: 44px 1fr auto;
    align-items: center;
    gap: 14px;
    padding: 13px 14px 13px 13px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--panel);
    -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
    box-shadow: var(--shadow);
    transition: transform .18s ease, border-color .18s ease, background-color .18s ease;
    outline: none;
  }
  .link:hover, .link:focus-visible { transform: translateY(-1px); border-color: var(--line-strong); }
  .link:active { transform: translateY(0) scale(.99); }
  .link .ico {
    width: 44px; height: 44px;
    display: grid; place-items: center;
    border-radius: 11px;
    border: 1px solid var(--line);
    background: var(--accent-soft);
    color: var(--accent);
    transition: background-color .18s, color .18s;
  }
  .link:hover .ico { background: var(--accent-fill); color: var(--accent-ink); }
  .link .ico svg { width: 21px; height: 21px; }
  .link .txt { min-width: 0; display: grid; gap: 1px; }
  .link .t { font: 600 16px/1.25 var(--sans); }
  .link .s {
    font: 500 11.5px/1.3 var(--mono);
    letter-spacing: .03em;
    color: var(--ink-3);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .link .go { width: 18px; height: 18px; color: var(--ink-3); transition: transform .18s, color .18s; }
  .link:hover .go { color: var(--accent); transform: translate(2px, -2px); }

  .link.primary {
    position: relative;
    overflow: hidden;
    padding: 17px 16px 17px 15px;
    background: linear-gradient(135deg, var(--accent-fill), #b80d17);
    border-color: transparent;
    color: var(--accent-ink);
    box-shadow: 0 16px 36px -16px var(--accent-glow), 0 0 0 1px rgba(255,255,255,.08) inset;
  }
  .link.primary .ico { background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.24); color: var(--accent-ink); }
  .link.primary .t { font: 700 18px/1.2 var(--display); letter-spacing: .08em; text-transform: uppercase; }
  .link.primary .s { color: currentColor; opacity: .72; white-space: normal; }
  .link.primary .go { color: currentColor; }
  .link.primary::after {
    content: "";
    position: absolute; top: 0; bottom: 0; left: -40%;
    width: 30%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.28), transparent);
    transform: skewX(-18deg);
    animation: sweep 4.5s ease-in-out infinite 1.2s;
    pointer-events: none;
  }
  @keyframes sweep { 0% { left: -40%; } 35%, 100% { left: 130%; } }

  .link.off { opacity: .55; cursor: not-allowed; }
  .link.off:hover { transform: none; border-color: var(--line); }
  .link.off .ico { background: transparent; color: var(--ink-3); }
  .link.primary.off { background: var(--panel); color: var(--ink); box-shadow: none; border-color: var(--line-strong); border-style: dashed; }
  .link.primary.off::after { display: none; }
  .soon {
    font: 600 9.5px/1 var(--mono);
    letter-spacing: .12em;
    padding: 4px 6px;
    border-radius: 4px;
    border: 1px dashed var(--line-strong);
    color: var(--ink-3);
  }

  /* ---------- Bölümler ---------- */
  section { margin-top: 42px; }
  .sec-h {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 16px;
    font: 600 11px/1 var(--mono);
    letter-spacing: .16em;
    color: var(--ink-3);
    text-transform: uppercase;
  }
  .sec-h .idx { color: var(--accent); }
  .sec-h h2 {
    margin: 0;
    font: 700 13px/1 var(--display);
    letter-spacing: .22em;
    color: var(--ink);
    text-transform: uppercase;
  }
  .sec-h .rule { flex: 1; height: 1px; background: linear-gradient(90deg, var(--line-strong), transparent); }

  .panel {
    padding: 18px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--panel);
    -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
    box-shadow: var(--shadow);
  }
  .about { position: relative; overflow: hidden; padding: 22px 20px 20px; }
  .about::after {
    content: "";
    position: absolute; right: -130px; top: -130px;
    width: 280px; height: 280px;
    border-radius: 50%;
    background:
      linear-gradient(var(--line), var(--line)) center / 100% 1px no-repeat,
      linear-gradient(var(--line), var(--line)) center / 1px 100% no-repeat,
      repeating-radial-gradient(circle at center, transparent 0 27px, var(--line-strong) 27px 28px);
    -webkit-mask-image: radial-gradient(circle, #000 30%, transparent 70%);
            mask-image: radial-gradient(circle, #000 30%, transparent 70%);
    opacity: .7;
    pointer-events: none;
  }
  .kicker {
    display: flex; align-items: center; gap: 8px;
    margin: 0 0 12px;
    font: 600 10.5px/1 var(--mono);
    letter-spacing: .2em;
    color: var(--accent);
  }
  .kicker::after { content: ""; width: 28px; height: 1px; background: var(--accent); opacity: .6; }
  .lead {
    position: relative; z-index: 1;
    margin: 0;
    padding-left: 14px;
    border-left: 2px solid var(--accent);
    font: 600 20px/1.42 var(--display);
    letter-spacing: .005em;
    color: var(--ink);
    text-wrap: pretty;
  }
  .lead em { font-style: normal; color: var(--accent); }
  .about .body {
    position: relative; z-index: 1;
    margin: 14px 0 0;
    color: var(--ink-2);
    font-size: 15px; line-height: 1.65;
    text-wrap: pretty;
  }
  .caps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; }
  .cap {
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    padding: 18px 6px 14px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: linear-gradient(180deg, var(--accent-soft), transparent 75%);
    transition: border-color .2s, transform .2s;
  }
  .cap:hover { border-color: var(--line-strong); transform: translateY(-1px); }
  .cap .n { position: absolute; top: 7px; left: 9px; font: 600 9px/1 var(--mono); letter-spacing: .1em; color: var(--ink-3); }
  .cap .ci {
    width: 46px; height: 46px;
    display: grid; place-items: center;
    border-radius: 50%;
    border: 1px solid var(--line-strong);
    color: var(--accent);
    background: var(--panel-solid);
    box-shadow: 0 0 18px -6px var(--accent-glow);
  }
  .cap .ci svg { width: 22px; height: 22px; }
  .cap .cl {
    font: 700 12.5px/1 var(--display);
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink);
  }

  /* ---------- Filo ---------- */
  .fleet { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .ac {
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--panel-solid);
    box-shadow: var(--shadow);
    transition: border-color .2s, transform .2s;
  }
  .ac:hover { border-color: var(--line-strong); transform: translateY(-2px); }
  .ac-img {
    aspect-ratio: 4 / 5;
    overflow: hidden;
    border-radius: 13px 13px 0 0;
    background: var(--accent-soft);
  }
  .ac-img img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .6s cubic-bezier(.2,.7,.2,1); }
  .ac:hover .ac-img img { transform: scale(1.05); }
  .ac-img svg { width: 100%; height: 100%; display: block; color: var(--accent); }
  .ac-img svg .f { fill: var(--panel-solid); stroke: currentColor; stroke-width: 1.4; stroke-linejoin: round; }
  .ac-img svg .p { stroke: var(--ink-2); stroke-width: 2; stroke-linecap: round; }
  .ac-img svg .cl { stroke: currentColor; stroke-width: .6; stroke-dasharray: 3 2; opacity: .55; }
  .ac-name {
    display: flex; flex-direction: column; align-items: center; gap: 7px;
    padding: 11px 8px 12px;
    font: 700 15px/1.1 var(--display);
    letter-spacing: .1em;
    text-align: center;
  }
  .ac-name::after { content: ""; width: 24px; height: 2px; border-radius: 2px; background: var(--accent); }

  /* ---------- Sponsorluk ---------- */
  .sponsor h3 {
    margin: 0 0 6px;
    font: 700 21px/1.2 var(--display);
    letter-spacing: .02em;
  }
  .sponsor p { margin: 0; color: var(--ink-2); }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 46px;
    padding: 0 14px;
    border-radius: 11px;
    border: 1px solid var(--line-strong);
    font: 600 14px/1 var(--sans);
    cursor: pointer;
    background: transparent;
    transition: background-color .18s, border-color .18s, transform .18s;
  }
  .btn svg { width: 17px; height: 17px; }
  .btn:hover { border-color: var(--accent); }
  .btn:active { transform: scale(.98); }
  .btn.solid { background: var(--accent-fill); color: var(--accent-ink); border-color: var(--accent-fill); }
  .btn.off { opacity: .5; pointer-events: none; border-style: dashed; }
  .btn.solid.off { background: transparent; color: var(--ink-2); border-color: var(--line-strong); }
  .mail-line {
    margin-top: 12px;
    font: 500 12px/1.4 var(--mono);
    color: var(--ink-3);
    text-align: center;
    word-break: break-all;
  }

  /* ---------- Alt bilgi ---------- */
  footer {
    margin-top: 44px;
    text-align: center;
    font: 600 10.5px/1.6 var(--mono);
    letter-spacing: .14em;
    color: var(--ink-3);
  }
  .foot-logo { width: 72px; height: 72px; margin: 0 auto 20px; padding: 4px; border-radius: 18px;
    box-shadow: 0 0 0 1px var(--line-strong), 0 14px 34px -14px var(--accent-glow); }
  .share { margin: 0 auto 18px; display: inline-flex; width: auto; padding: 0 18px; }
  footer .tele { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; margin-top: 6px; opacity: .8; }

  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom));
    transform: translate(-50%, 20px);
    padding: 10px 14px;
    border-radius: 10px;
    background: var(--ink); color: var(--bg);
    font: 600 13px/1 var(--sans);
    opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s;
    z-index: 10;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* giriş animasyonu */
  .rise { opacity: 0; transform: translateY(10px); animation: rise .6s cubic-bezier(.2,.7,.2,1) forwards; }
  @keyframes rise { to { opacity: 1; transform: none; } }

  @media (min-width: 640px) {
    .wrap { max-width: 600px; }
    .ac-name { font-size: 17px; }
    .caps { grid-template-columns: repeat(3, 1fr); }
  }

/* Yapay ufuk göstergesi */
(function adi() {
  const host = $("adi");
  let ticks = "";
  [-60, -45, -30, -20, -10, 0, 10, 20, 30, 45, 60].forEach((a) => {
    const big = a === 0 || Math.abs(a) === 30 || Math.abs(a) === 60;
    const r1 = big ? 83 : 86, r2 = 93;
    const rad = (a - 90) * Math.PI / 180;
    ticks += `<line class="tick${big ? " big" : ""}" x1="${(r1 * Math.cos(rad)).toFixed(2)}" y1="${(r1 * Math.sin(rad)).toFixed(2)}" x2="${(r2 * Math.cos(rad)).toFixed(2)}" y2="${(r2 * Math.sin(rad)).toFixed(2)}"/>`;

  let ladder = "";

    const y = -p * 2.2, w = Math.abs(p) === 10 ? 18 : 28;
    ladder += `<line class="pl" x1="${-w}" x2="${w}" y1="${y}" y2="${y}"/>`;
    ladder += `<text class="pl-t" x="${w + 4}" y="${y + 2.5}">${Math.abs(p)}</text><text class="pl-t" x="${-w - 14}" y="${y + 2.5}">${Math.abs(p)}</text>`;
  });
  [-5, 5, -15, 15].forEach((p) => { const y = -p * 2.2; ladder += `<line class="pl" x1="-8" x2="8" y1="${y}" y2="${y}"/>`; });

  const inner = `
      <g clip-path="url(#adiClip)">
        <g id="horizon">
          <rect class="sky" x="-200" y="-200" width="400" height="200"/>
          <rect class="ground" x="-200" y="0" width="400" height="200"/>
          <line class="hz" x1="-200" x2="200" y1="0" y2="0"/>

        </g>
      </g>

      <circle class="dot" r="3.2"/>`;
  host.innerHTML = `
    <svg viewBox="-100 -100 200 200">
      <defs><clipPath id="adiClip"><circle r="76"/></clipPath></defs>
      <circle class="ring" r="97"/>
      ${ticks}
      <g id="rollPtr"><path class="ptr" d="M0 -78l-5 -8h10z"/></g>
      ${inner}
      <circle class="ring-in" r="76"/>
    </svg>`;
})();

/* Pusula bandı */
(function tape() {
  const PX = 1.6; // derece başına piksel
  const W = 360 * PX;
  const names = { 0: "K", 90: "D", 180: "G", 270: "B" }; // Kuzey, Doğu, Güney, Batı
  let s = "";
  for (let d = 0; d < 720; d += 5) {
    const x = d * PX, deg = d % 360;
    if (deg % 30 === 0) {
      s += `<line class="maj" x1="${x}" x2="${x}" y1="20" y2="34"/>`;
      const lab = names[deg] ?? String(deg).padStart(3, "0");
      s += `<text class="${names[deg] ? "card" : ""}" x="${x}" y="15" text-anchor="middle">${lab}</text>`;
    } else {
      s += `<line x1="${x}" x2="${x}" y1="${deg % 10 === 0 ? 26 : 29}" y2="34"/>`;
    }
  }
  const track = $("tapeTrack");
  track.innerHTML = `<svg width="${W * 2}" viewBox="0 0 ${W * 2} 34">${s}</svg>`;

  const horizon = document.getElementById("horizon");
  const rollPtr = document.getElementById("rollPtr");
  const hdgEl = $("hdg"), altEl = $("teleAlt"), spdEl = $("teleSpd");
  const t0 = performance.now();

  function frame(now) {
    const t = (now - t0) / 1000;
    const hdg = (274 + t * 4) % 360;
    track.style.transform = `translateX(${-hdg * PX}px)`;
    hdgEl.textContent = "HDG " + String(Math.round(hdg) % 360).padStart(3, "0");
    const roll = 8 * Math.sin(t * 0.45);
    const pitch = 4 * Math.sin(t * 0.31 + 1);
    if (horizon) horizon.setAttribute("transform", `rotate(${roll.toFixed(2)}) translate(0 ${(pitch * 2.2).toFixed(2)})`);
    if (rollPtr) rollPtr.setAttribute("transform", `rotate(${roll.toFixed(2)})`);
    if (Math.floor(t * 4) % 4 === 0) {
      altEl.textContent = "ALT " + Math.round(120 + 6 * Math.sin(t * 0.2)) + "M";
      spdEl.textContent = "GS " + (18 + 1.5 * Math.sin(t * 0.33)).toFixed(1) + "M/S";
    }
    if (!reduceMotion) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

/* ---------- Filo ---------- */
$("fleetCount").textContent = String(SITE.fleet.length).padStart(2, "0") + " HAVA ARACI";
$("fleet").innerHTML = SITE.fleet.map((a) => `
  <article class="ac brk rise">
    <div class="ac-img">${a.photo
      ? `<img src="${esc(a.photo)}" alt="${esc(a.name)}" loading="lazy" width="420" height="525">`
      : `<svg viewBox="0 0 100 100" role="img" aria-label="${esc(a.name)}">${SHAPES[a.shape] || SHAPES.trainer}</svg>`}</div>
    <div class="ac-name">${esc(a.name)}</div>
  </article>`).join("");

/* ---------- Logo ---------- */
["topLogo", "footLogo"].forEach((id) => { const el = $(id); if (SITE.logo) el.src = SITE.logo; else el.remove(); });

/* ---------- Sponsorluk ---------- */
(function sponsor() {
  const sp = SITE.sponsor;
  $("sponsorTitle").textContent = sp.title;
  $("sponsorText").textContent = sp.text;
  const mail = sp.email;
  const subj = encodeURIComponent("Sponsorluk / İş Birliği — Hürtürk İHA");
  let html = mail
    ? `<a class="btn solid" href="mailto:${esc(mail)}?subject=${subj}">${ICONS.handshake}Sponsor Ol</a>
       <a class="btn" href="mailto:${esc(mail)}">${ICONS.mail}E-posta</a>`
    : `<span class="btn solid off">${ICONS.handshake}Sponsor Ol</span><span class="btn off">${ICONS.mail}E-posta</span>`;
  if (sp.deckUrl) html += `<a class="btn" style="grid-column:1/-1" href="${esc(sp.deckUrl)}" target="_blank" rel="noopener">${ICONS.doc}Sponsorluk Dosyası</a>`;
  $("sponsorBtns").innerHTML = html;
  $("mailLine").textContent = mail ? mail : "E-POSTA ADRESİ EKLENECEK";
})();

/* ---------- Alt bilgi & paylaş ---------- */
$("copy").textContent = SITE.footer;
const toast = (msg) => { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 1800); };
$("shareBtn").addEventListener("click", async () => {
  const data = { title: document.title, text: "Hürtürk İHA Takımı", url: location.href };
  try {
    if (navigator.share) { await navigator.share(data); return; }
    await navigator.clipboard.writeText(location.href);
    toast("Link kopyalandı");
  } catch (e) {
    if (e && e.name === "AbortError") return;
    toast(location.href);
  }
});

/* Kaydırınca beliren bölümler */
(function reveal() {
  if (reduceMotion || !("IntersectionObserver" in window)) return;
  document.querySelectorAll(".ac.rise").forEach((el) => { el.style.animationPlayState = "paused"; });
  const io = new IntersectionObserver((entries) => {
    entries.forEach((e) => { if (e.isIntersecting) { e.target.style.animationPlayState = "running"; io.unobserve(e.target); } });
  }, { threshold: 0.15 });
  document.querySelectorAll(".ac.rise").forEach((el, i) => { el.style.animationDelay = (i % 2) * 0.08 + "s"; io.observe(el); });
})();
</script>
</body>
</html>
